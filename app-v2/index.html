<!doctype html>
<!--
  Zgarnij Oreo · WebAR v2 (Oreo × Lisek)
  ─────────────────────────────────────────────────────────────────────────────
  Pakiety (npm):
    npm i react@18 react-dom@18 three@0.169 @react-three/fiber@8 @react-three/drei@9 \
          @react-three/postprocessing@2 postprocessing@6 framer-motion@11 zustand@4 \
          @mediapipe/tasks-vision@0.10.14 clsx tailwind-merge@2 lucide-react
    npm i -D vite@5 @vitejs/plugin-react@4 typescript@5 @types/react@18 @types/react-dom@18 \
          @types/three tailwindcss@3 postcss autoprefixer vite-plugin-singlefile@2

  shadcn / Skiper UI:
    npx shadcn@latest init                  # components.json jest już w repo (style new-york, alias @/ui)
    npx shadcn@latest add @skiper-ui/<nazwa> # komponenty Skiper UI z rejestru, np. @skiper-ui/skiper40
    (zależności Skiper UI: framer-motion, clsx, tailwind-merge, lucide-react – w liście powyżej)

  Świadomie BEZ @react-three/xr: gra wymaga klatek kamery dla śledzenia dłoni (MediaPipe).
  Safari na iOS nie ma WebXR, a w sesji immersive-ar na Androidzie strona nie dostaje
  obrazu kamery. Dlatego: kamera jako tekstura tła + MediaPipe + paralaksa z żyroskopu.

  Build: npm run build -> dist/index.html (jeden plik, działa jako artefakt i na GitHub Pages)
-->
